<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мой Календарь-Планировщик</title>

<!-- Manifest для того, чтобы код можно было установить как приложение -->
<link rel="manifest" href="data:application/manifest+json,{%22name%22:%22%D0%9F%D0%BB%D0%B0%D0%BD%D0%B8%D1%80%D0%BE%D0%B2%D1%89%D0%B8%D0%BA%22,%22short_name%22:%22%D0%9F%D0%BB%D0%B0%D0%BD%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%23ffffff%22,%22theme_color%22:%22%23ffffff%22}">

<style>
* { box-sizing: border-box; font-family: Arial, sans-serif; }
body { background: #f5f5f5; color: #222; margin: 0; padding: 16px; display: flex; justify-content: center; }
.app-container { background: white; width: 100%; max-width: 500px; min-height: 90vh; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); padding: 20px; position: relative; overflow: hidden; }

/* ЭКРАН 1: КАЛЕНДАРЬ */
.screen { display: none; }
.screen.active { display: block; }
.calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 22px; font-weight: bold; }
.calendar-header button { border: none; background: transparent; font-size: 24px; cursor: pointer; }
.weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: bold; font-size: 14px; color: #777; margin-bottom: 10px; }
.days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
.day-cell { aspect-ratio: 1; border: 1px solid #ddd; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; position: relative; background: #fafafa; }
.day-cell:hover { background: #f0f0f0; }
.day-cell.empty { border: none; background: transparent; cursor: default; }
.day-cell.today { border: 2px solid #222; font-weight: bold; }
.day-dots { display: flex; gap: 3px; position: absolute; bottom: 4px; }
.dot { width: 6px; height: 6px; border-radius: 50%; }
.dot.red { background: #d71920; }
.dot.green { background: #a8dc00; }

/* ЭКРАН 2: ДЕНЬ */
.day-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
.back-btn { border: none; background: transparent; font-size: 28px; cursor: pointer; padding: 0; }
.day-title { font-size: 22px; font-weight: bold; }
.section { margin-bottom: 25px; }
.heading { font-size: 18px; font-weight: bold; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.task { display: flex; align-items: center; gap: 12px; margin: 12px 0; font-size: 16px; }
.task input { appearance: none; width: 18px; height: 18px; border: 1px solid #888; border-radius: 3px; flex-shrink: 0; margin: 0; position: relative; cursor: pointer; }
.task.red input { background: #d71920; border-color: #d71920; }
.task.green input { background: #a8dc00; border-color: #91bf00; }
.task input:checked::after { content: "✓"; color: white; position: absolute; top: -3px; left: 2px; font-size: 14px; font-weight: bold; }
.task span { flex: 1; overflow-wrap: anywhere; }
.task.done span { text-decoration: line-through; color: #999; }
.delete { border: none; background: transparent; color: #aaa; font-size: 18px; cursor: pointer; }
.add { display: flex; gap: 7px; margin-top: 8px; }
.add input { min-width: 0; flex: 1; border: none; border-bottom: 1px solid #ccc; padding: 8px 3px; font-size: 16px; outline: none; }
.add button { border: none; background: transparent; color: #555; padding: 0 10px; font-size: 24px; cursor: pointer; }
</style>
</head>
<body>

<div class="app-container">

  <!-- ЭКРАН 1: МЕСЯЦ -->
  <div id="calendarScreen" class="screen active">
    <div class="calendar-header">
      <button onclick="changeMonth(-1)">‹</button>
      <span id="monthTitle">Месяц Год</span>
      <button onclick="changeMonth(1)">›</button>
    </div>
    <div class="weekdays">
      <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
    </div>
    <div id="daysGrid" class="days-grid"></div>
  </div>

  <!-- ЭКРАН 2: ПЛАНИРОВЩИК ДНЯ -->
  <div id="dayScreen" class="screen">
    <div class="day-header">
      <button class="back-btn" onclick="openCalendar()">‹</button>
      <div class="day-title" id="dayScreenTitle">День недели</div>
    </div>
    <div class="content">
      <div class="section">
        <div class="heading">🔴 Обязательно сегодня</div>
        <div id="redTaskList"></div>
        <div class="add">
          <input id="redTaskInput" placeholder="Добавить задачу..." onkeydown="handleEnter(event, 'red')">
          <button onclick="addTask('red')">+</button>
        </div>
      </div>
      <div class="section">
        <div class="heading">🟩 Необязательно сегодня</div>
        <div id="greenTaskList"></div>
        <div class="add">
          <input id="greenTaskInput" placeholder="Добавить задачу..." onkeydown="handleEnter(event, 'green')">
          <button onclick="addTask('green')">+</button>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
const KEY = "advanced_calendar_planner_v3";
const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
const dayNames = ["Воскресенье", "Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота"];

let currentDate = new Date(); 
let selectedDateKey = ""; 

let data = JSON.parse(localStorage.getItem(KEY) || '{"tasks":[]}');
if (!Array.isArray(data.tasks)) data.tasks = [];

function save() { localStorage.setItem(KEY, JSON.stringify(data)); }

function formatDateKey(date) {
  return [date.getFullYear(), String(date.getMonth()+1).padStart(2,"0"), String(date.getDate()).padStart(2,"0")].join("-");
}

// Автоматический перенос невыполненных ЗЕЛЕНЫХ задач изо дня в день
function rollOverTasks() {
  const todayStr = formatDateKey(new Date());
  if (data.lastDate !== todayStr) {
    data.tasks.forEach(task => {
      if (!task.done && task.type === 'green' && task.date < todayStr) {
        task.date = todayStr; // сдвигаем на сегодня
      }
    });
    data.lastDate = todayStr;
    save();
  }
}

function renderCalendar() {
  rollOverTasks();
  document.getElementById("calendarScreen").classList.add("active");
  document.getElementById("dayScreen").classList.remove("active");

  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();
  document.getElementById("monthTitle").textContent = `${monthNames[month]} ${year}`;

  const firstDayIndex = new Date(year, month, 1).getDay();
  const shift = firstDayIndex === 0 ? 6 : firstDayIndex - 1; // подгон под Пн-Вс
  const totalDays = new Date(year, month + 1, 0).getDate();

  const grid = document.getElementById("daysGrid");
  grid.innerHTML = "";

  for (let i = 0; i < shift; i++) {
    const emptyCell = document.createElement("div");
    emptyCell.className = "day-cell empty";
    grid.append(emptyCell);
  }

  const todayStr = formatDateKey(new Date());
  for (let d = 1; d <= totalDays; d++) {
    const cellDate = new Date(year, month, d);
    const cellKey = formatDateKey(cellDate);

    const cell = document.createElement("div");
    cell.className = "day-cell";
    if (cellKey === todayStr) cell.classList.add("today");
    cell.innerHTML = `<span>${d}</span>`;

    const dayTasks = data.tasks.filter(t => t.date === cellKey);
    if (dayTasks.length > 0) {
      const dotsContainer = document.createElement("div");
      dotsContainer.className = "day-dots";
      if (dayTasks.some(t => t.type === 'red' && !t.done)) {
        const rDot = document.createElement("div"); rDot.className = "dot red"; dotsContainer.append(rDot);
      }
      if (dayTasks.some(t => t.type === 'green' && !t.done)) {
        const gDot = document.createElement("div"); gDot.className = "dot green"; dotsContainer.append(gDot);
      }
      cell.append(dotsContainer);
    }

    cell.onclick = () => openDay(cellKey);
    grid.append(cell);
  }
}

function changeMonth(amount) {
  currentDate.setMonth(currentDate.getMonth() + amount);
  renderCalendar();
}

function openCalendar() {
  renderCalendar();
}

function openDay(dateKey) {
  selectedDateKey = dateKey;
  document.getElementById("calendarScreen").classList.remove("active");
  document.getElementById("dayScreen").classList.add("active");

  const [y, m, d] = dateKey.split("-").map(Number);
  const dateObj = new Date(y, m - 1, d);
  document.getElementById("dayScreenTitle").textContent = `${d} ${monthNames[m-1]}, ${dayNames[dateObj.getDay()]}`;

  renderTasks();
}

function renderTasks() {
  const redList = document.getElementById("redTaskList");
  const greenList = document.getElementById("greenTaskList");
  redList.innerHTML = "";
  greenList.innerHTML = "";

  const tasks = data.tasks.filter(t => t.date === selectedDateKey);

  tasks.forEach(task => {
    const row = document.createElement("div");
    row.className = `task ${task.type} ${task.done ? 'done' : ''}`;

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = task.done;
    checkbox.onchange = () => {
      task.done = checkbox.checked;
      save();
      renderTasks();
    };

    const text = document.createElement("span");
    text.textContent = task.text;

    const del = document.createElement("button");
    del.className = "delete";
    del.textContent = "×";
    del.onclick = () => {
      data.tasks = data.tasks.filter(t => t !== task);
      save();
      renderTasks();
    };

    row.append(checkbox, text, del);
    if (task.type === 'red') redList.append(row);
    else greenList.append(row);
  });
}

function addTask(type) {
  const input = document.getElementById(type === 'red' ? "redTaskInput" : "greenTaskInput");
  const text = input.value.trim();
  if (!text) return;

data.tasks.push({ text: text, type: type, done: false, date: selectedDateKey });
input.value = "";
save();
renderTasks();
}
function handleEnter(e, type) {
if (e.key === "Enter") addTask(type);
}
renderCalendar();
